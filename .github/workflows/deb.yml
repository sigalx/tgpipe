name: Build Debian package

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deb:
    name: Build .deb
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            debhelper \
            dpkg-dev \
            rsync \
            shellcheck \
            shfmt

      - name: Build Debian package
        run: make deb

      - name: Upload Debian artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tgpipe-debian-package
          if-no-files-found: error
          path: |
            dist/tgpipe_*_all.deb
            dist/tgpipe_*.buildinfo
            dist/tgpipe_*.changes
